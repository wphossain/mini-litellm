providers:

  openai:
    api_keys:
      - ${OPENAI_API_KEY_1}
      - ${OPENAI_API_KEY_2}

  openrouter:
    api_keys:
      - ${OPENROUTER_API_KEY_1}

  anthropic:
    api_keys:
      - ${ANTHROPIC_API_KEY_1}

  gemini:
    api_keys:
      - ${GEMINI_API_KEY_1}


models:

  gpt-4o:
    provider: openai
    model: gpt-4o

  gpt-4.1-mini:
    provider: openai
    model: gpt-4.1-mini

  claude-sonnet-4:
    provider: anthropic
    model: claude-sonnet-4

  gemini-2.5-pro:
    provider: gemini
    model: gemini-2.5-pro

  deepseek-v3:
    provider: openrouter
    model: deepseek/deepseek-chat
