version: "3.9"

services:
  gateway:
    build: .
    container_name: mini-litellm-gateway
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-INFO}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 128m

  # Optional: Ollama for local models
  ollama:
    image: ollama/ollama:latest
    container_name: mini-litellm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - local

volumes:
  ollama_data:
